<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento Rápido - Sinais Vitais</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 15, 25, 0.5), rgba(0, 15, 25, 0.5)), url('Imagens/Fundo_sepse.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-tecnico {
            background: #003366;
            color: #fff;
            padding: 12px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-form {
            max-width: 580px;
            width: 100%;
            margin: 12px auto;
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            box-sizing: border-box;
            overflow-y: auto;
            max-height: calc(100vh - 65px);
        }

        .step-section {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .step-title {
            font-size: 0.9rem; /* Fonte aumentada */
            font-weight: bold;
            color: #0056b3;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-row { display: flex; gap: 12px; margin-bottom: 8px; }
        .form-group { flex: 1; position: relative; }
        
        .form-group label { 
            display: block; 
            font-size: 0.85rem; /* Fonte aumentada para leitura nítida */
            color: #555; 
            margin-bottom: 4px; 
            font-weight: 600; 
        }

        /* Equilíbrio: Letras grandes com espaçamento interno controlado para não estourar a tela */
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 10px; 
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem; /* Letras maiores e mais confortáveis */
            color: #333;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #f97316;
            outline: none;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
            background-color: #fffaf5;
        }

        .campo-invalido {
            border-color: #dc3545 !important;
            background-color: rgba(220, 53, 69, 0.05) !important;
            box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.2) !important;
        }

        .input-icon-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-icon-container .icon-lupa {
            position: absolute;
            right: 10px;
            color: #0056b3;
            cursor: pointer;
            font-size: 1.1rem;
        }
        
        .input-icon-container input {
            padding-right: 32px;
        }

        .paciente-info-box {
            display: none;
            background: #e6f0fa;
            padding: 8px 10px;
            border-radius: 4px;
            border-left: 3px solid #0056b3;
            margin-top: 6px;
            font-size: 0.9rem; /* Fonte aumentada */
            color: #003366;
            font-weight: 600;
        }

        .novo-paciente-box {
            display: none;
            background: #fff8f1;
            border: 1px dashed #f97316;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .news-preview-container {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .news-preview-input {
            width: 55px !important;
            font-size: 1.3rem !important; /* Destaque maior no número do escore */
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            padding: 2px !important;
            background: #fff;
        }

        .status-alerta-texto {
            font-size: 0.9rem; /* Fonte aumentada */
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px;
            flex: 1;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            margin-left: 10px;
            line-height: 1.3;
        }

        .status-alerta-texto .subtexto-conduta {
            font-size: 0.78rem;
            font-weight: normal;
            margin-top: 2px;
            opacity: 0.9;
        }

        .input-destacado-alerta {
            border: 2px solid #ff9933 !important;
            background-color: rgba(255, 153, 51, 0.08) !important;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-acao {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem; /* Botões mais legíveis */
            cursor: pointer;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        
        .btn-acao:active { transform: scale(0.98); }
        .btn-enviar { background: #0056b3; }
        .btn-enviar:hover { background: #004494; }
        .btn-relatorio { background: #17a2b8; }
        .btn-relatorio:hover { background: #138496; }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            min-width: 280px;
            max-width: 400px;
            padding: 14px 18px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.error { background-color: #dc3545; border-left: 6px solid #a71d2a; }
        .toast.success { background-color: #28a745; border-left: 6px solid #145523; }
        .toast.warning { background-color: #ffc107; color: #333; border-left: 6px solid #d39e00; }

        #modal-relatorio {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 480px;
            max-width: 90%;
            box-shadow: 0 4px 25px rgba(0,0,0,0.3);
        }

        .buscando-indicator {
            font-size: 0.78rem;
            color: #0056b3;
            font-style: italic;
            margin-top: 2px;
            display: none;
        }

        .btn-instalar-app {
            background: #f97316;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            display: none; 
            gap: 5px;
            align-items: center;
        }
        .btn-instalar-app:hover { background: #ea580c; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header class="header-tecnico">
        <span>LANÇAMENTO RÁPIDO DE SINAIS VITAIS</span>
        <button id="btn-instalar-pwa" class="btn-instalar-app">📲 Instalar App</button>
    </header>

    <main class="main-form" id="form-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; color: #666; background: #f8fafc; padding: 6px 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
            <span>Técnico Responsável: <strong id="lbl-tecnico-logado" style="color: #003366;">---</strong></span>
            <button onclick="sairDoPainel()" style="background: none; border: none; color: #dc3545; font-weight: bold; cursor: pointer; font-size: 0.85rem;">Sair / Trocar</button>
        </div>

        <div class="step-section">
            <div class="step-title">📍 Identificação, Horário e Responsável</div>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Nº PRONTUÁRIO</label>
                    <div class="input-icon-container">
                        <input type="text" id="input-prontuario" inputmode="numeric" placeholder="Digite..." autofocus>
                        <span class="icon-lupa" onclick="buscarPacientePorProntuario()" title="Buscar Paciente">🔍</span>
                    </div>
                    <span id="lbl-buscando" class="buscando-indicator">🔍 Buscando paciente...</span>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>HORÁRIO</label>
                    <select id="select-hora">
                        <option value="08:00">08:00</option>
                        <option value="12:00">12:00</option>
                        <option value="16:00">16:00</option>
                        <option value="20:00">20:00</option>
                        <option value="00:00">00:00</option>
                        <option value="04:00">04:00</option>
                        <option value="outro">Outro...</option>
                    </select>
                    <input type="time" id="input-hora-custom" style="display: none; margin-top: 5px; width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px;" placeholder="HH:mm">
                </div>
            </div>
            
            <div class="form-row" style="margin-top: 6px; margin-bottom: 0;">
                <div class="form-group" style="width: 100%;">
                    <label>ENFERMEIRO GESTOR / AVISADO</label>
                    <input type="text" id="input-enfermeiro" placeholder="Nome do enfermeiro...">
                </div>
            </div>

            <div class="form-row" style="margin-top: 6px; margin-bottom: 0;">
                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="check-paciente-isento" style="width: 16px; height: 16px; cursor: pointer;" onchange="alternarModoIsento()">
                    <label for="check-paciente-isento" style="margin: 0; color: #c2410c; font-weight: bold; cursor: pointer;">Paciente Isento de Escores (NEWS / PEWS)</label>
                </div>
            </div>

            <div id="paciente-info" class="paciente-info-box">
                Paciente: <span id="span-nome" style="font-weight: normal;">---</span> | Setor/Leito: <span id="span-setor" style="font-weight: normal;">---</span> <span id="span-idade-info" style="font-style: italic; opacity: 0.8;"></span>
            </div>

            <div id="novo-paciente-container" class="novo-paciente-box">
                <div style="font-size: 0.85rem; font-weight: bold; color: #c2410c; margin-bottom: 6px;">⚠️ Prontuário novo. Confirme os dados para hoje:</div>
                <div class="form-row" style="margin-bottom: 6px;">
                    <div class="form-group" style="flex: 2;">
                        <label>NOME DO PACIENTE</label>
                        <input type="text" id="novo-nome-paciente" placeholder="Nome completo...">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>NASCIMENTO</label>
                        <input type="date" id="novo-dtnasc-paciente" onchange="verificarIdadeNovoPaciente()">
                    </div>
                </div>
                <div class="form-row" style="margin-bottom: 0; gap: 12px;">
                    <div class="form-group" style="flex: 2;">
                        <label>LOCAL / SETOR</label>
                        <select id="novo-setor-paciente" onchange="verificarSetorOuIdade()">
                            <option value="enf1">Enfermaria 1</option>
                            <option value="enf2">Enfermaria 2</option>
                            <option value="enf3">Enfermaria 3</option>
                            <option value="enf4">Enfermaria 4</option>
                            <option value="enf5">Enfermaria 5</option>
                            <option value="corredor">Corredor</option>
                            <option value="enf-pediatria">Pediatria</option>
                            <option value="sala-emergencia">Emergência</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Nº LEITO</label>
                        <select id="novo-leito-paciente" style="cursor: pointer; font-weight: bold; color: #003366;">
                            <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="step-section" style="border-bottom: none; margin-bottom: 8px;">
            <div class="step-title" id="titulo-secao-escore">🩺 Parâmetros, Escala de Dor e Escore NEWS</div>
            
            <div id="bloco-campos-news">
                <div class="form-row">
                    <div class="form-group"><label>PAS (mmHg)</label><input type="number" id="pas" inputmode="decimal" min="40" max="300"></div>
                    <div class="form-group"><label>TEMP (°C)</label><input type="number" step="0.1" id="temp" inputmode="decimal" min="30" max="45"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>FR (irpm)</label><input type="number" id="fr" inputmode="decimal" min="5" max="60"></div>
                    <div class="form-group"><label>FC (bpm)</label><input type="number" id="fc" inputmode="decimal" min="20" max="250"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>O₂ Suplementar?</label>
                        <select id="o2"><option selected></option><option>Sim</option><option>Não</option></select>
                    </div>
                    <div class="form-group"><label>Sat %</label><input type="number" id="sat" inputmode="decimal" min="50" max="100"></div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex: 2;"><label>Nível de Consciência</label>
                        <select id="consc">
                            <option selected></option>
                            <option>Alerta</option>
                            <option>AGITADO/CONFUSO</option>
                            <option>VOZ, DOR OU NÃO REAGE</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Glicemia</label><input type="number" id="glicemia" inputmode="decimal" min="10" max="1000"></div>
                </div>
            </div>

            <div id="bloco-campos-pews" style="display: none;">
                <div class="form-row">
                    <div class="form-group"><label>FC (bpm)</label><input type="number" id="pews-fc" inputmode="decimal" min="30" max="300"></div>
                    <div class="form-group"><label>FR (irpm)</label><input type="number" id="pews-fr" inputmode="decimal" min="5" max="100"></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>COMPORTAMENTO</label>
                        <select id="pews-comp">
                            <option value="" selected></option>
                            <option value="0">0 - Normal / Brincando</option>
                            <option value="1">1 - Sonolento</option>
                            <option value="2">2 - Irritado</option>
                            <option value="3">3 - Confuso / Letárgico / Resposta red. a dor</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>VÔMITOS</label>
                        <select id="pews-vomitos">
                            <option value="" selected></option>
                            <option value="0">0 - Ausentes</option>
                            <option value="2">2 - Vômitos Persistentes</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>NEBULIZADOR / ESPAÇADOR</label>
                        <select id="pews-nebulizador">
                            <option value="" selected></option>
                            <option value="0">0 - Não</option>
                            <option value="1">1 - A cada 20 min / Freq. > que a cada 20 min</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>TEMP (°C)</label><input type="number" step="0.1" id="pews-temp" inputmode="decimal" min="30" max="45">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Glicemia (Opcional)</label><input type="number" id="glicemia-pews" inputmode="decimal" min="10" max="1000"></div>
                </div>
            </div>

            <div class="form-row" style="margin-top: 6px;">
                <div class="form-group" style="width: 100%;">
                    <label>ESCALA DE DOR</label>
                    <select id="escala-dor">
                        <option value="" selected>-</option>
                        <option value="0">0 - Ausente</option>
                        <option value="1">1 a 4 - Leve</option>
                        <option value="4">5 a 7 - Moderada</option>
                        <option value="7">8 a 10 - Intensa</option>
                    </select>
                </div>
            </div>

            <div class="news-preview-container" style="margin-top: 10px;">
                <div>
                    <label style="margin: 0; font-size: 0.75rem;" id="lbl-titulo-escore-total">NEWS Total</label>
                    <input type="text" id="news-total" class="news-preview-input" readonly style="width: 75px !important;">
                </div>
                <div id="status-news-texto" class="status-alerta-texto">Aguardando...</div>
            </div>
        </div>

        <div class="button-row">
            <button class="btn-acao btn-relatorio">📄 Gerar Relatório</button>
            <button class="btn-acao btn-enviar">🚀 Enviar p/ Planilha</button>
        </div>
    </main>

    <div id="modal-relatorio">
        <div class="modal-box">
            <h3 style="color: #003366; margin-top: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;">📋 Relatório para Lançamento</h3>
            <textarea id="texto-relatorio-gerado" style="width: 100%; height: 130px; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; resize: none; box-sizing: border-box; background: #fff; outline: none;" placeholder="Edite o relatório aqui se necessário..."></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px;">
                <button id="btn-copiar-texto" style="background: #28a745; color: #fff; border: none; padding: 10px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">📋 Copiar Texto</button>
                <button id="btn-fechar-modal" style="background: #64748b; color: #fff; border: none; padding: 10px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fwaheunpekyvwyysqncz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_er3si1epfRHUz8SQP26B1A__aFx0cTy';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tecnicoLogadoGlobal = localStorage.getItem('tecnico_logado_nome') || "Técnico(a)";
        let modoPediátricoAtivo = false;
        let dataNascimentoPacienteAtual = "";

        // Sistema de Toasts
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = '❌';
            if (type === 'success') icon = '✅';
            if (type === 'warning') icon = '⚠️';
            
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Configuração central dos limites para ser usada nas duas validações
        const configLimitesCampos = [
            { id: 'pas', min: 40, max: 300, nome: 'PAS' },
            { id: 'temp', min: 30, max: 45, nome: 'Temperatura' },
            { id: 'fr', min: 5, max: 60, nome: 'FR' },
            { id: 'fc', min: 20, max: 250, nome: 'FC' },
            { id: 'sat', min: 50, max: 100, nome: 'SatO₂' },
            { id: 'glicemia', min: 10, max: 1000, nome: 'Glicemia' },
            { id: 'pews-fc', min: 30, max: 300, nome: 'FC Pediátrica' },
            { id: 'pews-fr', min: 5, max: 100, nome: 'FR Pediátrica' },
            { id: 'pews-temp', min: 30, max: 45, nome: 'Temp. Pediátrica' },
            { id: 'glicemia-pews', min: 10, max: 1000, nome: 'Glicemia Pediátrica' }
        ];

        // Validação Visual em Tempo Real + Alerta ao Sair do Campo (Blur)
        function aplicarValidacaoTempoReal() {
            configLimitesCampos.forEach(item => {
                const el = document.getElementById(item.id);
                if (!el) return;

                // Valida enquanto digita
                el.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    if (e.target.value !== "" && (val < item.min || val > item.max)) {
                        e.target.classList.add('campo-invalido');
                    } else {
                        e.target.classList.remove('campo-invalido');
                    }
                });

                // Valida ao sair do campo
                el.addEventListener('blur', (e) => {
                    const val = parseFloat(e.target.value);
                    if (e.target.value !== "" && (val < item.min || val > item.max)) {
                        showToast(`Valor fora do limite para ${item.nome} (${val}). Verifique a digitação.`, 'warning');
                    }
                });
            });
        }

        // Bloqueio final ao tentar enviar dados errados
        function validarLimitesBiologicos() {
            for (let item of configLimitesCampos) {
                const el = document.getElementById(item.id);
                if (el && el.value !== "") {
                    const val = parseFloat(el.value);
                    if (val < item.min || val > item.max) {
                        showToast(`Valor fora do limite para ${item.nome} (${val}). Verifique a digitação antes de enviar.`, 'warning');
                        el.focus();
                        return false;
                    }
                }
            }
            return true;
        }

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btnInstalar = document.getElementById('btn-instalar-pwa');
            if (btnInstalar) {
                btnInstalar.style.display = 'flex';
                btnInstalar.addEventListener('click', async () => {
                    btnInstalar.style.display = 'none';

        function calcularIdadeAnos(dtNascStr) {
            if (!dtNascStr) return null;
            const hoje = new Date();
            const nascimento = new Date(dtNascStr + 'T00:00:00');
            let anos = hoje.getFullYear() - nascimento.getFullYear();
            const m = hoje.getMonth() - nascimento.getMonth();
            if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
                anos--;
            }
            return anos;
        }

        function obterFaixaEtariaPews(dataNascStr) {
            if (!dataNascStr) return "1-3 anos";
            const nasc = new Date(dataNascStr + 'T00:00:00');
            const hoje = new Date();
            let anos = hoje.getFullYear() - nasc.getFullYear();
            let meses = (hoje.getFullYear() - nasc.getFullYear()) * 12 + (hoje.getMonth() - nasc.getMonth());
            let dias = hoje.getDate() - nasc.getDate();
            if (dias < 0) meses--;

            if (meses < 3) return "< 3 meses";
            if (meses < 12 || (meses === 12 && dias === 0)) return "3 meses a 11m29d";
            if (anos >= 1 && anos <= 3) return "1-3 anos";
            if (anos >= 4 && anos <= 7) return "4-7 anos";
            if (anos >= 8 && anos <= 12) return "8-12 anos";
            return "> 12 anos";
        }

        async function buscarPacientePorProntuario() {
            const prontuarioInput = document.getElementById('input-prontuario').value.trim();
            const infoBox = document.getElementById('paciente-info');
            const novoBox = document.getElementById('novo-paciente-container');
            const checkboxIsento = document.getElementById('check-paciente-isento');
            const lblBuscando = document.getElementById('lbl-buscando');

            dataNascimentoPacienteAtual = "";
            window.pacienteHistoricoEncontrado = null;

            if (!prontuarioInput) {
                if (infoBox) infoBox.style.display = 'none';
                if (novoBox) novoBox.style.display = 'none';
                if (checkboxIsento) checkboxIsento.checked = false;
                if (lblBuscando) lblBuscando.style.display = 'none';
                return;
            }

            if (lblBuscando) lblBuscando.style.display = 'block';

            const dataAtual = new Date();
            const ano = dataAtual.getFullYear();
            const mes = String(dataAtual.getMonth() + 1).padStart(2, '0');
            const dia = String(dataAtual.getDate()).padStart(2, '0');
            const hojeStr = `${ano}-${mes}-${dia}`;

            let pacienteEncontrado = null;
            let setorEncontrado = null;
            let leitoEncontrado = null;

            try {
                const { data: plantaoAtual } = await _supabase
                    .from('plantoes')
                    .select('dados_json')
                    .eq('data_chave', hojeStr)
                    .maybeSingle();

                if (plantaoAtual && plantaoAtual.dados_json && Array.isArray(plantaoAtual.dados_json)) {
                    const pHoje = plantaoAtual.dados_json.find(p => p.prontuario && p.prontuario.toString().trim() === prontuarioInput);
                    if (pHoje) {
                        pacienteEncontrado = pHoje;
                        setorEncontrado = pHoje.setor;
                        leitoEncontrado = pHoje.leito || "01";
                        dataNascimentoPacienteAtual = pHoje.dtNasc || "";
                    }
                }

                if (!pacienteEncontrado) {
                    const { data: historicoPlantoes } = await _supabase
                        .from('plantoes')
                        .select('dados_json')
                        .order('data_chave', { ascending: false })
                        .limit(30);

                    if (historicoPlantoes && historicoPlantoes.length > 0) {
                        for (const plantao of historicoPlantoes) {
                            if (plantao.dados_json && Array.isArray(plantao.dados_json)) {
                                const pAntigo = plantao.dados_json.find(p => p.prontuario && p.prontuario.toString().trim() === prontuarioInput);
                                if (pAntigo) {
                                    pacienteEncontrado = pAntigo;
                                    setorEncontrado = pAntigo.setor || 'corredor';
                                    leitoEncontrado = pAntigo.leito || '01';
                                    dataNascimentoPacienteAtual = pAntigo.dtNasc || "";
                                    break;
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Erro na busca:", err);
            } finally {
                if (lblBuscando) lblBuscando.style.display = 'none';
            }

            if (pacienteEncontrado && pacienteEncontrado.nome) {
                window.pacienteHistoricoEncontrado = pacienteEncontrado;
                document.getElementById('span-nome').textContent = pacienteEncontrado.nome;
                document.getElementById('span-setor').textContent = `${setorEncontrado.toUpperCase()} (Leito ${leitoEncontrado})`;
                
                if (checkboxIsento) checkboxIsento.checked = !!pacienteEncontrado.isento;
                
                let idadeTexto = "";
                let ehPed = (setorEncontrado === 'enf-pediatria');
                if (dataNascimentoPacienteAtual) {
                    const idadeVal = calcularIdadeAnos(dataNascimentoPacienteAtual);
                    idadeTexto = ` — ${idadeVal} anos`;
                    if (idadeVal !== null && idadeVal < 12) ehPed = true;
                }
                document.getElementById('span-idade-info').textContent = idadeTexto;

                if (infoBox) infoBox.style.display = 'block';
                if (novoBox) novoBox.style.display = 'none';
                alternarModoFormulario(ehPed);
                if (pacienteEncontrado.isento) alternarModoIsento();
            } else {
                if (infoBox) infoBox.style.display = 'none';
                if (checkboxIsento) checkboxIsento.checked = false;
                if (novoBox) {
                    document.getElementById('novo-nome-paciente').value = "";
                    document.getElementById('novo-dtnasc-paciente').value = "";
                    document.getElementById('novo-setor-paciente').selectedIndex = 0;
                    document.getElementById('novo-leito-paciente').selectedIndex = 0;
                    novoBox.style.display = 'block';
                    document.getElementById('novo-nome-paciente').focus();
                    verificarSetorOuIdade();
                }
            }
        }

        function calcularPewsTecnico() {
            if (document.getElementById('check-paciente-isento')?.checked) return;
            if (!modoPediátricoAtivo) return;

            const dtNasc = dataNascimentoPacienteAtual || document.getElementById('novo-dtnasc-paciente')?.value || "";

            }

            if (document.getElementById('pews-temp')?.value !== "") {
                if (temp < 35 || temp >= 40) pTemp = 3; else if (temp >= 39.1 && temp <= 39.9) pTemp = 2; else if ((temp >= 38.1 && temp <= 39.0) || (temp >= 35.1 && temp <= 36.0)) pTemp = 1;

                }
                statusTexto.innerHTML = `${titulo}<span class="subtexto-conduta">${subtexto}</span>`;
                statusTexto.style.backgroundColor = corBg; statusTexto.style.color = corTxt; statusTexto.style.border = `1px solid ${corBorda}`;
            }
        }

        async function enviarDadosParaPlanilha() {
            if (!validarLimitesBiologicos()) return;

            const btnEnviarEl = document.querySelector('.btn-enviar');
            const prontuario = document.getElementById('input-prontuario').value.trim();
            const selectHora = document.getElementById('select-hora').value;
            const horaCustom = document.getElementById('input-hora-custom').value;
            const enfermeiro = document.getElementById('input-enfermeiro').value.trim();
            const isIsento = document.getElementById('check-paciente-isento')?.checked || false;

            if (!prontuario) {
                showToast("Por favor, informe o número do prontuário.", "warning");
                document.getElementById('input-prontuario').focus();
                return;
            }

            let horaSelecionada = selectHora === 'outro' ? horaCustom : selectHora;
            if (!horaSelecionada) {
                showToast("Por favor, selecione ou informe o horário do registro.", "warning");
                return;
            }

            if (enfermeiro) {
                localStorage.setItem('ultimo_enfermeiro_plantao', enfermeiro);
            }

            if (btnEnviarEl) {
                btnEnviarEl.disabled = true;
                btnEnviarEl.innerHTML = "⏳ Salvando...";
            }

            try {
                const dataAtual = new Date();
                const ano = dataAtual.getFullYear();
                const mes = String(dataAtual.getMonth() + 1).padStart(2, '0');
                const dia = String(dataAtual.getDate()).padStart(2, '0');
                const hojeStr = `${ano}-${mes}-${dia}`;

                const { data: plantaoAtual, error: erroBusca } = await _supabase
                    .from('plantoes')
                    .select('dados_json')
                    .eq('data_chave', hojeStr)
                    .maybeSingle();

                if (erroBusca) throw new Error("Erro ao sincronizar com o plantão de hoje.");

                let listaPacientes = plantaoAtual && Array.isArray(plantaoAtual.dados_json) ? plantaoAtual.dados_json : [];
                let valoresVitaisForm = modoPediátricoAtivo ? [
                    "-", document.getElementById('pews-temp').value, document.getElementById('pews-fr').value,
                    document.getElementById('pews-fc').value, "-", "-", document.getElementById('pews-comp').value,
                    document.getElementById('glicemia-pews').value, document.getElementById('escala-dor').value,
                    document.getElementById('news-total').value, ""
                ] : [
                    document.getElementById('pas').value, document.getElementById('temp').value, document.getElementById('fr').value,
                    document.getElementById('fc').value, document.getElementById('o2').value, document.getElementById('sat').value,
                    document.getElementById('consc').value, document.getElementById('glicemia').value, document.getElementById('escala-dor').value,
                    document.getElementById('news-total').value, ""
                ];

                let pacienteAlvo = listaPacientes.find(p => p.prontuario && p.prontuario.toString().trim() === prontuario);

                if (pacienteAlvo) {
                    pacienteAlvo.tec = tecnicoLogadoGlobal;
                    if (enfermeiro) pacienteAlvo.enfermeiro = enfermeiro;
                    pacienteAlvo.isento = isIsento;
                    if (!Array.isArray(pacienteAlvo.vitais)) pacienteAlvo.vitais = [];

                    let linhaExistente = pacienteAlvo.vitais.find(v => v.hora === horaSelecionada);
                    if (linhaExistente) {
                        linhaExistente.inputs = valoresVitaisForm;
                    } else {
                        const horasPadrao = ['08:00', '12:00', '16:00', '20:00', '00:00', '04:00'];
                        pacienteAlvo.vitais.push({
                            hora: horaSelecionada, inputs: valoresVitaisForm, isExtra: !horasPadrao.includes(horaSelecionada)
                        });
                    }
                } else {
                    let nomePacienteFinal = "", setorFinal = "corredor", leitoFinal = "01";
                    const infoBoxVisivel = document.getElementById('paciente-info').style.display === 'block';

                    if (infoBoxVisivel && window.pacienteHistoricoEncontrado) {
                        nomePacienteFinal = window.pacienteHistoricoEncontrado.nome;
                        setorFinal = window.pacienteHistoricoEncontrado.setor || "corredor";
                        leitoFinal = window.pacienteHistoricoEncontrado.leito || "01";
                    } else {
                        nomePacienteFinal = document.getElementById('novo-nome-paciente')?.value.trim();
                        setorFinal = document.getElementById('novo-setor-paciente')?.value || 'corredor';
                        leitoFinal = document.getElementById('novo-leito-paciente')?.value || '01';
                    }

                    if (!nomePacienteFinal) {
                        showToast("Nome do paciente não identificado. Aguarde a busca ou preencha o novo cadastro.", "error");
                        return;
                    }

                    const horasPadrao = ['08:00', '12:00', '16:00', '20:00', '00:00', '04:00'];
                    let vitaisIniciais = horasPadrao.map(h => ({ hora: h, inputs: Array(11).fill(""), isExtra: false }));

                    if (!horasPadrao.includes(horaSelecionada)) {
                        vitaisIniciais.push({ hora: horaSelecionada, inputs: valoresVitaisForm, isExtra: true });
                    } else {
                        let indexPadrao = vitaisIniciais.findIndex(v => v.hora === horaSelecionada);
                        if (indexPadrao !== -1) vitaisIniciais[indexPadrao].inputs = valoresVitaisForm;
                    }

                    listaPacientes.push({
                        setor: setorFinal, leito: leitoFinal, nome: nomePacienteFinal, dtNasc: document.getElementById('novo-dtnasc-paciente')?.value || "",
                        prontuario: prontuario, tec: tecnicoLogadoGlobal, enfermeiro: enfermeiro || "", isento: isIsento, desfecho: "Internado", vitais: vitaisIniciais
                    });
                }

                const { error: erroSave } = await _supabase
                    .from('plantoes')
                    .upsert({ data_chave: hojeStr, dados_json: listaPacientes, mes_ano: hojeStr.substring(0, 7), updated_at: new Date() }, { onConflict: 'data_chave' });

                if (erroSave) throw new Error(erroSave.message);

                showToast("Sinais vitais enviados com sucesso para a planilha!", "success");
                limparFormularioTecnico();

            } catch (erro) {
                console.error("Erro ao enviar:", erro);
                try {
                    let filaOffline = JSON.parse(localStorage.getItem('fila_offline_sinais') || '[]');
                    filaOffline.push({ prontuario, hora: horaSelecionada, enfermeiro, isento: isIsento, data: new Date().toISOString() });
                    localStorage.setItem('fila_offline_sinais', JSON.stringify(filaOffline));
                    showToast("Sem conexão. Dados salvos localmente e serão sincronizados após o retorno da rede.", "warning");
                    limparFormularioTecnico();
                } catch (errStorage) {
                    showToast("Falha no envio e falha ao salvar localmente no cache.", "error");
                }
            } finally {
                if (btnEnviarEl) {
                    btnEnviarEl.disabled = false;
                    btnEnviarEl.innerHTML = "🚀 Enviar p/ Planilha";
                }
            }
        }

        function gerarRelatorioTecnico() {
            const hora = document.getElementById('select-hora').value === 'outro' ? document.getElementById('input-hora-custom').value : document.getElementById('select-hora').value;
            const enfermeiro = document.getElementById('input-enfermeiro').value.trim() || "[Nome do Enfermeiro]";
            const isIsento = document.getElementById('check-paciente-isento')?.checked || false;
            
            const selectDor = document.getElementById('escala-dor');
            const dor = selectDor && selectDor.selectedOptions[0] ? selectDor.selectedOptions[0].text : "Não avaliado";
            const escoreVal = document.getElementById('news-total').value || "0";
            let texto = "";

            const pas = document.getElementById('pas').value || "-";
            const temp = document.getElementById('temp').value || "-";
            const fr = document.getElementById('fr').value || "-";
            const fc = document.getElementById('fc').value || "-";
            const sat = document.getElementById('sat').value || "-";
            const o2SimNao = document.getElementById('o2').value || "Não";
            const consc = document.getElementById('consc').value || "Alerta";
            const usoO2Texto = o2SimNao.toUpperCase() === "SIM" ? "Usa O₂ suplementar" : "Não usa O₂ suplementar";
            const sinaisVitaisStr = `PA: ${pas} mmHg, Temp: ${temp} °C, FC: ${fc} bpm, FR: ${fr} irpm, SatO₂: ${sat}% (${usoO2Texto}), Nív Consc: ${consc}, Dor: ${dor}`;

            if (isIsento) {
                texto = `Às ${hora} horas, realizo aferição de sinais vitais (${sinaisVitaisStr}). Paciente encontra-se isento de aplicação de escores (NEWS/PEWS). Comunicado ao(à) enfermeiro(a) ${enfermeiro}.`;
            } else if (modoPediátricoAtivo) {
                const fcPed = document.getElementById('pews-fc').value || "-";
                const frPed = document.getElementById('pews-fr').value || "-";
                const tempPed = document.getElementById('pews-temp').value || "-";
                texto = `Em tempo, às ${hora} horas, comunico sinais vitais pediátricos: Temp ${tempPed}°C, FC ${fcPed}bpm, FR ${frPed}irpm, Dor: ${dor}. Valor de PEWS: ${escoreVal}. Comunicado ao(à) enfermeiro(a) ${enfermeiro}.`;
            } else {
                const escoreNum = parseInt(escoreVal) || 0;
                let temIsoladoTres = false;
                const fVal = parseFloat(fr) || 0, sVal = parseFloat(sat) || 0, pVal = parseFloat(pas) || 0, cVal = parseFloat(fc) || 0, tVal = parseFloat(String(temp).replace(',', '.')) || 0;

                if (fVal <= 8 || fVal >= 25 || sVal <= 91 || (pVal > 0 && pVal <= 90) || pVal >= 220 || cVal <= 40 || cVal >= 131 || tVal <= 35.0 || consc === "VOZ, DOR OU NÃO REAGE") temIsoladoTres = true;

                let sirsCount = 0;
                if (cVal > 90) sirsCount++; if (fVal > 20) sirsCount++; if (tVal > 38.3 || (tVal > 0 && tVal < 35)) sirsCount++;
                const pConscVal = (consc.toUpperCase() === "VOZ, DOR OU NÃO REAGE") ? 3 : (consc.toUpperCase() === "AGITADO/CONFUSO" ? 2 : 0);
                const sepseSat = (sVal > 0 && ((sVal < 90 && o2SimNao.toUpperCase() !== "SIM") || (sVal < 94 && o2SimNao.toUpperCase() === "SIM")));
                const isAlertaSepse = (sirsCount >= 2 || pConscVal >= 3 || (pVal > 0 && pVal < 90) || sepseSat);

                if (isAlertaSepse) { texto = `Às ${hora} horas, identifico sinais de alerta de sepse. Comunico ao(à) enfermeiro(a) ${enfermeiro}. Sinais vitais e parâmetros: ${sinaisVitaisStr}, NEWS: ${escoreNum}.`; }
                else if (escoreNum === 0) { texto = `Às ${hora} horas, realizo aferição de sinais vitais (${sinaisVitaisStr}). Paciente apresenta NEWS com Escore 0 (Estável). Comunicado ao(à) enfermeiro(a) ${enfermeiro}.`; }
                else if (escoreNum >= 1 && escoreNum <= 3 && !temIsoladoTres) { texto = `Às ${hora} horas, realizo aferição de sinais vitais (${sinaisVitaisStr}) e aplicação do escore NEWS, classificado como Baixo Risco (${escoreNum}). Comunicado ao(à) enfermeiro(a) ${enfermeiro}.`; }
                else if ((escoreNum >= 4 && escoreNum <= 5) || (temIsoladoTres && escoreNum < 6)) { texto = `Em tempo, às ${hora} horas, comunico ao(à) enfermeiro(a) ${enfermeiro} que o paciente apresenta NEWS Médio Risco (${escoreNum}). Sinais vitais e parâmetros: ${sinaisVitaisStr}.`; }
                else { texto = `Às ${hora} horas, comunico ao(à) enfermeiro(a) ${enfermeiro} que o paciente apresenta NEWS Alto Risco (${escoreNum}). Sinais vitais e parâmetros: ${sinaisVitaisStr}.`; }
            }

            const modal = document.getElementById('modal-relatorio');
            const textarea = document.getElementById('texto-relatorio-gerado');
            if (textarea) textarea.value = texto;
            if (modal) modal.style.display = 'flex';
        }

        function copiarTextoRelatorio() {
            const textarea = document.getElementById('texto-relatorio-gerado');
            const btnCopiar = document.getElementById('btn-copiar-texto');

            if (textarea) {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    if (btnCopiar) {
                        const textareaOriginalTexto = btnCopiar.innerHTML;
                        btnCopiar.innerHTML = "✅ Copiado!";
                        btnCopiar.style.backgroundColor = "#15803d";
                        setTimeout(() => { btnCopiar.innerHTML = textareaOriginalTexto; btnCopiar.style.backgroundColor = "#28a745"; }, 2000);
                    }
                }).catch(err => {
                    showToast("Erro ao copiar o texto.", "error");
                });
            }
        }

        function fecharModalRelatorio() {
            const modal = document.getElementById('modal-relatorio');
            if (modal) modal.style.display = 'none';
        }

        function limparFormularioTecnico() {
            document.getElementById('input-prontuario').value = "";
            const checkboxIsento = document.getElementById('check-paciente-isento');
            if (checkboxIsento) checkboxIsento.checked = false;
            
            document.getElementById('novo-nome-paciente').value = ""; document.getElementById('novo-dtnasc-paciente').value = "";
            
            ['pas', 'temp', 'fr', 'fc', 'sat', 'glicemia', 'pews-fc', 'pews-fr', 'pews-temp', 'glicemia-pews'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.value = ""; el.classList.remove('campo-invalido'); }
            });
            ['o2', 'consc', 'escala-dor', 'pews-comp', 'pews-vomitos', 'pews-nebulizador'].forEach(id => {
                const el = document.getElementById(id); if (el) el.selectedIndex = 0;
            });

            document.getElementById('news-total').value = "";
            document.getElementById('status-news-texto').innerHTML = "Aguardando...";
            document.getElementById('status-news-texto').style.backgroundColor = "transparent";
            document.getElementById('status-news-texto').style.color = "#333";
            document.getElementById('status-news-texto').style.border = "1px solid transparent";
            
            const infoBox = document.getElementById('paciente-info');
            const novoBox = document.getElementById('novo-paciente-container');
            if (infoBox) infoBox.style.display = 'none';
            if (novoBox) novoBox.style.display = 'none';

            const ultimoEnfermeiroSalvo = localStorage.getItem('ultimo_enfermeiro_plantao');
            if (ultimoEnfermeiroSalvo) document.getElementById('input-enfermeiro').value = ultimoEnfermeiroSalvo;
            
            document.getElementById('input-prontuario').focus();
        }
    </script>
