<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento Rápido - Sinais Vitais</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 15, 25, 0.5), rgba(0, 15, 25, 0.5)), url('Imagens/Fundo_sepse.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-tecnico {
            background: #003366;
            color: #fff;
            padding: 12px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .main-form {
            max-width: 580px;
            width: 100%;
            margin: 15px auto;
            background: #fff;
            padding: 20px 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            box-sizing: border-box;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .step-section {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .step-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #0056b3;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-row { display: flex; gap: 12px; margin-bottom: 8px; }
        .form-group { flex: 1; }
        
        .form-group label { 
            display: block; 
            font-size: 0.75rem; 
            color: #555; 
            margin-bottom: 3px; 
            font-weight: 600; 
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.88rem;
            color: #333;
            box-sizing: border-box;
        }

        .paciente-info-box {
            display: none;
            background: #e6f0fa;
            padding: 6px 10px;
            border-radius: 4px;
            border-left: 3px solid #0056b3;
            margin-top: 6px;
            font-size: 0.82rem;
            color: #003366;
            font-weight: 600;
        }

        .novo-paciente-box {
            display: none;
            background: #fff8f1;
            border: 1px dashed #f97316;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .news-preview-container {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .news-preview-input {
            width: 55px !important;
            font-size: 1.2rem !important;
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            padding: 2px !important;
        }

        .status-alerta-texto {
            font-size: 0.82rem;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px;
            flex: 1;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            margin-left: 10px;
            line-height: 1.3;
        }

        .status-alerta-texto .subtexto-conduta {
            font-size: 0.72rem;
            font-weight: normal;
            margin-top: 2px;
            opacity: 0.9;
        }

        .input-destacado-alerta {
            border: 2px solid #ff9933 !important;
            background-color: rgba(255, 153, 51, 0.08) !important;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-acao {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            color: white;
            text-align: center;
        }
        .btn-enviar { background: #0056b3; }
        .btn-enviar:hover { background: #004494; }
        
        .btn-relatorio { background: #17a2b8; }
        .btn-relatorio:hover { background: #138496; }

        #modal-relatorio {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 480px;
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

    <header class="header-tecnico">
        LANÇAMENTO RÁPIDO DE SINAIS VITAIS
    </header>

    <!-- FORMULÁRIO PRINCIPAL DIRETO -->
    <main class="main-form" id="form-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.8rem; color: #666; background: #f8fafc; padding: 6px 10px; border-radius: 4px;">
            <span>Técnico Responsável: <strong id="lbl-tecnico-logado" style="color: #003366;">---</strong></span>
            <button onclick="sairDoPainel()" style="background: none; border: none; color: #dc3545; font-weight: bold; cursor: pointer; font-size: 0.75rem;">Sair / Trocar</button>
        </div>

        <div class="step-section">
            <div class="step-title">📍 Identificação, Horário e Responsável</div>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Nº PRONTUÁRIO</label>
                    <input type="text" id="input-prontuario" placeholder="Digite..." autofocus>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>HORÁRIO</label>
                    <select id="select-hora">
                        <option value="08:00">08:00</option>
                        <option value="12:00">12:00</option>
                        <option value="16:00">16:00</option>
                        <option value="20:00">20:00</option>
                        <option value="00:00">00:00</option>
                        <option value="04:00">04:00</option>
                        <option value="outro">Outro (Digitar...)</option>
                    </select>
                    <input type="time" id="input-hora-custom" style="display: none; margin-top: 5px; width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px;" placeholder="HH:mm">
                </div>
            </div>
            
            <div class="form-row" style="margin-top: 6px; margin-bottom: 0;">
                <div class="form-group" style="width: 100%;">
                    <label>ENFERMEIRO GESTOR / AVISADO</label>
                    <input type="text" id="input-enfermeiro" placeholder="Nome do enfermeiro...">
                </div>
            </div>

            <div id="paciente-info" class="paciente-info-box">
                Paciente: <span id="span-nome" style="font-weight: normal;">---</span> | Setor/Leito: <span id="span-setor" style="font-weight: normal;">---</span> <span id="span-idade-info" style="font-style: italic; opacity: 0.8;"></span>
            </div>

            <div id="novo-paciente-container" class="novo-paciente-box">
                <div style="font-size: 0.78rem; font-weight: bold; color: #c2410c; margin-bottom: 6px;">⚠️ Prontuário não encontrado na base. Deseja cadastrar?</div>
                <div class="form-row" style="margin-bottom: 6px;">
                    <div class="form-group" style="flex: 2;">
                        <label>NOME DO PACIENTE</label>
                        <input type="text" id="novo-nome-paciente" placeholder="Nome completo...">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>DATA DE NASCIMENTO</label>
                        <input type="date" id="novo-dtnasc-paciente" onchange="verificarIdadeNovoPaciente()">
                    </div>
                </div>
                <div class="form-row" style="margin-bottom: 0; gap: 12px;">
                    <div class="form-group" style="flex: 2;">
                        <label>LOCAL / SETOR</label>
                        <select id="novo-setor-paciente" onchange="verificarSetorOuIdade()">
                            <option value="enf1">Enfermaria 1</option>
                            <option value="enf2">Enfermaria 2</option>
                            <option value="enf3">Enfermaria 3</option>
                            <option value="enf4">Enfermaria 4</option>
                            <option value="enf5">Enfermaria 5</option>
                            <option value="corredor">Corredor</option>
                            <option value="enf-pediatria">Pediatria</option>
                            <option value="sala-emergencia">Emergência</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Nº LEITO</label>
                        <select id="novo-leito-paciente" style="cursor: pointer; font-weight: bold; color: #003366;">
                            <option value="01">01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>
                            <option value="06">06</option>
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="step-section" style="border-bottom: none; margin-bottom: 8px;">
            <div class="step-title" id="titulo-secao-escore">🩺 Parâmetros, Escala de Dor e Escore NEWS</div>
            
            <div id="bloco-campos-news">
                <div class="form-row">
                    <div class="form-group"><label>PAS (mmHg)</label><input type="number" id="pas"></div>
                    <div class="form-group"><label>TEMP (°C)</label><input type="number" step="0.1" id="temp"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>FR (irpm)</label><input type="number" id="fr"></div>
                    <div class="form-group"><label>FC (bpm)</label><input type="number" id="fc"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>O₂ Suplementar?</label>
                        <select id="o2"><option selected></option><option>Sim</option><option>Não</option></select>
                    </div>
                    <div class="form-group"><label>Sat %</label><input type="number" id="sat"></div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex: 2;"><label>Nível de Consciência</label>
                        <select id="consc">
                            <option selected></option>
                            <option>Alerta</option>
                            <option>AGITADO/CONFUSO</option>
                            <option>VOZ, DOR OU NÃO REAGE</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Glicemia</label><input type="number" id="glicemia"></div>
                </div>
            </div>

            <div id="bloco-campos-pews" style="display: none;">
                <div class="form-row">
                    <div class="form-group"><label>FC (bpm)</label><input type="number" id="pews-fc"></div>
                    <div class="form-group"><label>FR (irpm)</label><input type="number" id="pews-fr"></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>COMPORTAMENTO</label>
                        <select id="pews-comp">
                            <option value="" selected></option>
                            <option value="0">0 - Normal / Brincando</option>
                            <option value="1">1 - Sonolento</option>
                            <option value="2">2 - Irritado</option>
                            <option value="3">3 - Confuso / Letárgico / Resposta red. a dor</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>VÔMITOS</label>
                        <select id="pews-vomitos">
                            <option value="" selected></option>
                            <option value="0">0 - Ausentes</option>
                            <option value="2">2 - Vômitos Persistentes</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>NEBULIZADOR / ESPAÇADOR</label>
                        <select id="pews-nebulizador">
                            <option value="" selected></option>
                            <option value="0">0 - Não</option>
                            <option value="1">1 - A cada 20 min / Freq. > que a cada 20 min</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>TEMP (°C)</label><input type="number" step="0.1" id="pews-temp">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Glicemia (Opcional)</label><input type="number" id="glicemia-pews"></div>
                </div>
            </div>

            <div class="form-row" style="margin-top: 6px;">
                <div class="form-group" style="width: 100%;">
                    <label>ESCALA DE DOR</label>
                    <select id="escala-dor">
                        <option value="" selected>-</option>
                        <option value="0">0 - Ausente</option>
                        <option value="1">1 a 4 - Leve</option>
                        <option value="4">5 a 7 - Moderada</option>
                        <option value="7">8 a 10 - Intensa</option>
                    </select>
                </div>
            </div>

            <div class="news-preview-container" style="margin-top: 10px;">
                <div>
                    <label style="margin: 0; font-size: 0.7rem;" id="lbl-titulo-escore-total">NEWS Total</label>
                    <input type="number" id="news-total" class="news-preview-input" readonly>
                </div>
                <div id="status-news-texto" class="status-alerta-texto">Aguardando...</div>
            </div>
        </div>

        <div class="button-row">
            <button class="btn-acao btn-relatorio">Gerar Relatório</button>
            <button class="btn-acao btn-enviar">Enviar p/ Planilha</button>
        </div>
    </main>

    <div id="modal-relatorio">
        <div class="modal-box">
            <h3 style="color: #003366; margin-top: 0; font-size: 1.1rem;">📋 Relatório para Lançamento</h3>
            <textarea id="texto-relatorio-gerado" style="width: 100%; height: 130px; padding: 10px; font-size: 0.88rem; border: 1px solid #ccc; border-radius: 4px; resize: none; box-sizing: border-box; background: #f8fafc;" readonly></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px;">
                <button id="btn-copiar-texto" style="background: #28a745; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer;">📋 Copiar Texto</button>
                <button id="btn-fechar-modal" style="background: #64748b; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer;">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fwaheunpekyvwyysqncz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_er3si1epfRHUz8SQP26B1A__aFx0cTy';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tecnicoLogadoGlobal = localStorage.getItem('tecnico_logado_nome') || "Técnico(a)";
        let modoPediátricoAtivo = false;
        let dataNascimentoPacienteAtual = "";

        document.addEventListener("DOMContentLoaded", () => {
            // Exibe direto o nome salvo na tela de login anterior
            document.getElementById('lbl-tecnico-logado').textContent = tecnicoLogadoGlobal;
            document.getElementById('input-prontuario').focus();

            const selectHora = document.getElementById('select-hora');
            const inputHoraCustom = document.getElementById('input-hora-custom');

            if (selectHora) {
                selectHora.addEventListener('change', () => {
                    if (selectHora.value === 'outro') {
                        inputHoraCustom.style.display = 'block';
                        inputHoraCustom.required = true;
                    } else {
                        inputHoraCustom.style.display = 'none';
                        inputHoraCustom.required = false;
                    }
                });
            }

            const inputProntuario = document.getElementById('input-prontuario');
            if (inputProntuario) {
                inputProntuario.addEventListener('blur', buscarPacientePorProntuario);
                inputProntuario.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        buscarPacientePorProntuario();
                    }
                });
            }

            const inputsVitaisNews = document.querySelectorAll('#pas, #temp, #fr, #fc, #o2, #sat, #consc');
            inputsVitaisNews.forEach(el => {
                el.addEventListener('input', calcularNewsTecnico);
                el.addEventListener('change', calcularNewsTecnico);
            });

            const inputsVitaisPews = document.querySelectorAll('#pews-fc, #pews-fr, #pews-comp, #pews-vomitos, #pews-nebulizador, #pews-temp');
            inputsVitaisPews.forEach(el => {
                el.addEventListener('input', calcularPewsTecnico);
                el.addEventListener('change', calcularPewsTecnico);
            });

            const btnEnviar = document.querySelector('.btn-enviar');
            if (btnEnviar) btnEnviar.addEventListener('click', enviarDadosParaPlanilha);

            const btnRelatorio = document.querySelector('.btn-relatorio');
            if (btnRelatorio) btnRelatorio.addEventListener('click', gerarRelatorioTecnico);

            const btnCopiar = document.getElementById('btn-copiar-texto');
            if (btnCopiar) btnCopiar.addEventListener('click', copiarTextoRelatorio);

            const btnFechar = document.getElementById('btn-fechar-modal');
            if (btnFechar) btnFechar.addEventListener('click', fecharModalRelatorio);
        });

        function sairDoPainel() {
            localStorage.removeItem('tecnico_logado_nome');
            window.location.href = "index.html";
        }

        function calcularIdadeAnos(dtNascStr) {
            if (!dtNascStr) return null;
            const hoje = new Date();
            const nascimento = new Date(dtNascStr);
            let anos = hoje.getFullYear() - nascimento.getFullYear();
            const m = hoje.getMonth() - nascimento.getMonth();
            if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
                anos--;
            }
            return anos;
        }

        function obterFaixaEtariaPews(dataNascStr) {
            if (!dataNascStr) return "1-3 anos";

            const nasc = new Date(dataNascStr);
            const hoje = new Date();
            
            let anos = hoje.getFullYear() - nasc.getFullYear();
            let meses = (hoje.getFullYear() - nasc.getFullYear()) * 12 + (hoje.getMonth() - nasc.getMonth());
            let dias = hoje.getDate() - nasc.getDate();
            if (dias < 0) meses--;

            if (meses < 3) return "< 3 meses";
            if (meses < 12 || (meses === 12 && dias === 0)) return "3 meses a 11m29d";
            if (anos >= 1 && anos <= 3) return "1-3 anos";
            if (anos >= 4 && anos <= 7) return "4-7 anos";
            if (anos >= 8 && anos <= 12) return "8-12 anos";
            return "> 12 anos";
        }

        function alternarModoFormulario(isPediatrico) {
            modoPediátricoAtivo = isPediatrico;
            const blocoNews = document.getElementById('bloco-campos-news');
            const blocoPews = document.getElementById('bloco-campos-pews');
            const tituloSecao = document.getElementById('titulo-secao-escore');
            const lblEscoreTotal = document.getElementById('lbl-titulo-escore-total');

            if (isPediatrico) {
                blocoNews.style.display = 'none';
                blocoPews.style.display = 'block';
                tituloSecao.textContent = "👶 Parâmetros, Escala de Dor e Escore PEWS (Pediatria)";
                lblEscoreTotal.textContent = "PEWS Total";
                calcularPewsTecnico();
            } else {
                blocoNews.style.display = 'block';
                blocoPews.style.display = 'none';
                tituloSecao.textContent = "🩺 Parâmetros, Escala de Dor e Escore NEWS";
                lblEscoreTotal.textContent = "NEWS Total";
                calcularNewsTecnico();
            }
        }

        function verificarSetorOuIdade() {
            const setorSelect = document.getElementById('novo-setor-paciente').value;
            const dtNasc = document.getElementById('novo-dtnasc-paciente').value;
            const idade = calcularIdadeAnos(dtNasc);

            if (setorSelect === 'enf-pediatria' || (idade !== null && idade < 18)) {
                alternarModoFormulario(true);
            } else {
                alternarModoFormulario(false);
            }
        }

        function verificarIdadeNovoPaciente() {
            verificarSetorOuIdade();
        }

        async function buscarPacientePorProntuario() {
            const prontuarioInput = document.getElementById('input-prontuario').value.trim();
            const infoBox = document.getElementById('paciente-info');
            const novoBox = document.getElementById('novo-paciente-container');

            dataNascimentoPacienteAtual = "";

            if (!prontuarioInput) {
                if (infoBox) infoBox.style.display = 'none';
                if (novoBox) novoBox.style.display = 'none';
                return;
            }

            const hojeStr = new Date().toISOString().split('T')[0];

            const { data, error } = await _supabase
                .from('plantoes')
                .select('dados_json')
                .eq('data_chave', hojeStr)
                .maybeSingle();

            let pacienteEncontrado = null;
            let setorEncontrado = null;
            let leitoEncontrado = null;

            if (data && data.dados_json && Array.isArray(data.dados_json)) {
                for (const p of data.dados_json) {
                    if (p.prontuario && p.prontuario.toString().trim() === prontuarioInput) {
                        pacienteEncontrado = p;
                        setorEncontrado = p.setor;
                        leitoEncontrado = p.leito || "01";
                        dataNascimentoPacienteAtual = p.dtNasc || "";
                        break;
                    }
                }
            }

            if (pacienteEncontrado) {
                document.getElementById('span-nome').textContent = pacienteEncontrado.nome;
                document.getElementById('span-setor').textContent = `${setorEncontrado.toUpperCase()} (Leito ${leitoEncontrado})`;
                
                let idadeTexto = "";
                let ehPed = (setorEncontrado === 'enf-pediatria');
                if (dataNascimentoPacienteAtual) {
                    const idadeVal = calcularIdadeAnos(dataNascimentoPacienteAtual);
                    idadeTexto = ` — ${idadeVal} anos`;
                    if (idadeVal < 18) ehPed = true;
                }
                document.getElementById('span-idade-info').textContent = idadeTexto;

                if (infoBox) infoBox.style.display = 'block';
                if (novoBox) novoBox.style.display = 'none';

                alternarModoFormulario(ehPed);
            } else {
                if (infoBox) infoBox.style.display = 'none';
                if (novoBox) {
                    novoBox.style.display = 'block';
                    document.getElementById('novo-nome-paciente').focus();
                    verificarSetorOuIdade();
                }
            }
        }

        function calcularNewsTecnico() {
            if (modoPediátricoAtivo) return;

            const pPas = document.getElementById('pas');
            const pTemp = document.getElementById('temp');
            const pFr = document.getElementById('fr');
            const pFc = document.getElementById('fc');
            const pO2 = document.getElementById('o2');
            const pSat = document.getElementById('sat');
            const pConsc = document.getElementById('consc');
            const inputNewsTotal = document.getElementById('news-total');
            const statusTexto = document.getElementById('status-news-texto');

            [pPas, pTemp, pFr, pFc, pSat, pConsc].forEach(el => {
                if (el) el.classList.remove('input-destacado-alerta');
            });

            const pas = parseFloat(pPas?.value) || 0;
            const temp = parseFloat(String(pTemp?.value || '').replace(',', '.')) || 0;
            const fr = parseFloat(pFr?.value) || 0;
            const fc = parseFloat(pFc?.value) || 0;
            const o2SimNao = pO2?.value ? pO2.value.toUpperCase() : "";
            const sat = parseFloat(pSat?.value) || 0;
            const consc = pConsc?.value ? pConsc.value.toUpperCase() : "";

            const preenchidos = [pPas?.value, pTemp?.value, pFr?.value, pFc?.value, pSat?.value, pO2?.value, pConsc?.value].filter(v => v !== "").length;
            if (preenchidos === 0) {
                if (inputNewsTotal) inputNewsTotal.value = "";
                if (statusTexto) {
                    statusTexto.innerHTML = "Aguardando...";
                    statusTexto.style.backgroundColor = "transparent";
                    statusTexto.style.color = "#333";
                    statusTexto.style.border = "1px solid transparent";
                }
                return;
            }

            let score = 0;
            if (pFr.value !== "") {
                if (fr <= 8 || fr >= 25) score += 3;
                else if (fr >= 21) score += 2;
                else if (fr >= 9 && fr <= 11) score += 1;
            }
            if (o2SimNao === "SIM") score += 2;
            if (pSat.value !== "") {
                if (sat <= 91) score += 3;
                else if (sat <= 93) score += 2;
                else if (sat <= 95) score += 1;
            }
          if (pPas.value !== "") {
                if (pas < 90) { score += 3; if (pPas) pPas.classList.add('input-destacado-alerta'); }
                else if (pas >= 220) score += 3;
                else if ((pas >= 90 && pas <= 100) || (pas >= 200 && pas <= 219)) score += 2;
                else if (pas <= 110 || (pas >= 131 && pas <= 199)) score += 1;
            }
            
            if (pFc.value !== "") {
                if (fc <= 40 || fc >= 131) score += 3;
                else if (fc >= 111) score += 2;
                else if ((fc >= 41 && fc <= 50) || (fc >= 91 && fc <= 130)) score += 1;
            }
            if (pTemp.value !== "") {
                if (temp < 35) score += 3;
                else if (temp >= 39.1) score += 2;
                else if ((temp >= 35 && temp <= 36) || (temp >= 38.1 && temp <= 39)) score += 1;
            }

            let pConscVal = 0;
            if (consc === "VOZ, DOR OU NÃO REAGE") {
                pConscVal = 3;
                if (pConsc) pConsc.classList.add('input-destacado-alerta');
            } else if (consc === "AGITADO/CONFUSO") {
                pConscVal = 2;
            }
            score += pConscVal;

            let sirsCount = 0;
            if (pFc.value && fc > 90) { sirsCount++; if (pFc) pFc.classList.add('input-destacado-alerta'); }
            if (pFr.value && fr > 20) { sirsCount++; if (pFr) pFr.classList.add('input-destacado-alerta'); }
            if (pTemp.value && (temp > 38.3 || (temp > 0 && temp < 35))) { sirsCount++; if (pTemp) pTemp.classList.add('input-destacado-alerta'); }

            const sepseSat = (sat > 0 && ((sat < 90 && o2SimNao !== "SIM") || (sat < 94 && o2SimNao === "SIM")));
            if (sepseSat && pSat) pSat.classList.add('input-destacado-alerta');

            const isAlertaSepse = (sirsCount >= 2 || pConscVal >= 3 || (pas > 0 && pas < 90) || sepseSat);

            if (inputNewsTotal) inputNewsTotal.value = score;

            if (statusTexto) {
                let corBg = "#e6ffe6";
                let corTxt = "#28a745";
                let corBorda = "#28a745";
                let titulo = "";
                let subtexto = "";

                if (isAlertaSepse) {
                    corBg = "#ffe6e6"; corTxt = "#dc3545"; corBorda = "#dc3545";
                    titulo = `🚨 ALERTA SEPSE`;
                    subtexto = `Acionar Enfermeiro / Médico imediato`;
                } else if (score >= 6) {
                    corBg = "#ffe6e6"; corTxt = "#dc3545"; corBorda = "#dc3545";
                    titulo = `🚨 ALTO RISCO (NEWS ${score})`;
                    subtexto = `Acionar Enfermeiro / Avaliação médica urgente`;
                } else if (score >= 4) {
                    corBg = "#fff3cd"; corTxt = "#856404"; corBorda = "#ffeeba";
                    titulo = `🟡 MÉDIO RISCO (NEWS ${score})`;
                    subtexto = `Solicitar avaliação do Enfermeiro`;
                } else if (score >= 1) {
                    corBg = "#d1ecf1"; corTxt = "#0c5460"; corBorda = "#bee5eb";
                    titulo = `🟢 BAIXO RISCO (NEWS ${score})`;
                    subtexto = `Monitorização rotineira`;
                } else {
                    corBg = "#e6ffe6"; corTxt = "#28a745"; corBorda = "#28a745";
                    titulo = `✔️ ESTÁVEL (NEWS 0)`;
                    subtexto = `Manter vigilância padrão`;
                }

                statusTexto.innerHTML = `${titulo}<span class="subtexto-conduta">${subtexto}</span>`;
                statusTexto.style.backgroundColor = corBg;
                statusTexto.style.color = corTxt;
                statusTexto.style.border = `1px solid ${corBorda}`;
            }
        }

        function calcularPewsTecnico() {
            if (!modoPediátricoAtivo) return;

            const dtNasc = dataNascimentoPacienteAtual || document.getElementById('novo-dtnasc-paciente')?.value || "";
            const faixaEtaria = obterFaixaEtariaPews(dtNasc);

            const fc = parseInt(document.getElementById('pews-fc').value) || 0;
            const fr = parseInt(document.getElementById('pews-fr').value) || 0;
            const comp = parseInt(document.getElementById('pews-comp')?.value || 0);
            const vomitos = parseInt(document.getElementById('pews-vomitos')?.value || 0);
            const nebulizador = parseInt(document.getElementById('pews-nebulizador')?.value || 0);
            const temp = parseFloat(String(document.getElementById('pews-temp')?.value || '').replace(',', '.')) || 0;

            let pFC = 0, pFR = 0, pTemp = 0;

            if (fc > 0) {
                if (faixaEtaria === "< 3 meses") {
                    if (fc <= 89 || fc >= 220) pFC = 3;
                    else if (fc >= 180 && fc <= 219) pFC = 2;
                    else if (fc >= 160 && fc <= 179) pFC = 1;
                } else if (faixaEtaria === "3 meses a 11m29d") {
                    if (fc <= 89 || fc >= 210) pFC = 3;
                    else if (fc >= 170 && fc <= 209) pFC = 2;
                    else if (fc >= 160 && fc <= 169) pFC = 1;
                } else if (faixaEtaria === "1-3 anos") {
                    if (fc <= 89 || fc >= 200) pFC = 3;
                    else if (fc >= 160 && fc <= 199) pFC = 2;
                    else if (fc >= 140 && fc <= 159) pFC = 1;
                } else if (faixaEtaria === "4-7 anos") {
                    if (fc <= 60 || fc >= 190) pFC = 3;
                    else if (fc >= 150 && fc <= 189) pFC = 2;
                    else if (fc >= 111 && fc <= 149 || (fc >= 61 && fc <= 69)) pFC = 1;
                } else {
                    if (fc <= 60 || fc >= 170) pFC = 3;
                    else if (fc >= 130 && fc <= 169) pFC = 2;
                    else if (fc >= 101 && fc <= 129 || (fc >= 60 && fc <= 65)) pFC = 1;
                }
            }

            if (fr > 0) {
                if (faixaEtaria === "< 3 meses") {
                    if (fr <= 25 || fr >= 90) pFR = 3;
                    else if (fr >= 79 && fr <= 89) pFR = 2;
                    else if (fr >= 60 && fr <= 78 || (fr >= 26 && fr <= 29)) pFR = 1;
                } else if (faixaEtaria === "3 meses a 11m29d") {
                    if (fr <= 20 || fr >= 80) pFR = 3;
                    else if (fr >= 69 && fr <= 79) pFR = 2;
                    else if (fr >= 54 && fr <= 68 || (fr >= 21 && fr <= 29)) pFR = 1;
                } else if (faixaEtaria === "1-3 anos") {
                    if (fr <= 15 || fr >= 70) pFR = 3;
                    else if (fr >= 59 && fr <= 69) pFR = 2;
                    else if (fr >= 40 && fr <= 58 || (fr >= 16 && fr <= 19)) pFR = 1;
                } else if (faixaEtaria === "4-7 anos") {
                    if (fr <= 15 || fr >= 60) pFR = 3;
                    else if (fr >= 49 && fr <= 59) pFR = 2;
                    else if (fr >= 30 && fr <= 48 || (fr >= 16 && fr <= 19)) pFR = 1;
                } else {
                    if (fr <= 10 || fr >= 50) pFR = 3;
                    else if (fr >= 39 && fr <= 49) pFR = 2;
                    else if (fr >= 26 && fr <= 38 || (fr >= 11 && fr <= 17)) pFR = 1;
                }
            }

            if (document.getElementById('pews-temp')?.value !== "") {
                if (temp < 35 || temp >= 40) pTemp = 3;
                else if (temp >= 39.1 && temp <= 39.9) pTemp = 2;
                else if ((temp >= 38.1 && temp <= 39.0) || (temp >= 35.1 && temp <= 36.0)) pTemp = 1;
            }

            const inputPewsTotal = document.getElementById('news-total');
            const statusTexto = document.getElementById('status-news-texto');

            const preenchidos = [
                document.getElementById('pews-fc')?.value,
                document.getElementById('pews-fr')?.value,
                document.getElementById('pews-comp')?.value,
                document.getElementById('pews-vomitos')?.value,
                document.getElementById('pews-nebulizador')?.value,
                document.getElementById('pews-temp')?.value
            ].filter(v => v !== "").length;

            if (preenchidos === 0) {
                if (inputPewsTotal) inputPewsTotal.value = "";
                if (statusTexto) {
                    statusTexto.innerHTML = "Aguardando...";
                    statusTexto.style.backgroundColor = "transparent";
                    statusTexto.style.color = "#333";
                    statusTexto.style.border = "1px solid transparent";
                }
                return;
            }

            const totalPews = pFC + pFR + comp + vomitos + nebulizador + pTemp;
            if (inputPewsTotal) inputPewsTotal.value = totalPews;

            if (statusTexto) {
                let corBg = "#e6ffe6";
                let corTxt = "#28a745";
                let corBorda = "#28a745";
                let titulo = "";
                let subtexto = "";

                if (totalPews <= 1) {
                    corBg = "#e6ffe6"; corTxt = "#28a745"; corBorda = "#28a745";
                    titulo = `🟢 ESCORE ${totalPews} (SEM RISCO)`;
                    subtexto = `Reavaliar a cada 4h / Ou conforme necessidade`;
                } else if (totalPews === 2) {
                    corBg = "#fff3cd"; corTxt = "#856404"; corBorda = "#ffeeba";
                    titulo = `🟡 ESCORE 2 (BAIXO RISCO)`;
                    subtexto = `Solicitar avaliação do Enfermeiro (Reavaliar em 3h)`;
                } else if (totalPews >= 3 && totalPews <= 4) {
                    corBg = "#ffe8cc"; corTxt = "#d97706"; corBorda = "#fbd38d";
                    titulo = `🟠 ESCORE ${totalPews} (MÉDIO RISCO)`;
                    subtexto = `Avaliação do pediatra em 30 min (Reavaliar em 1h)`;
                } else {
                    corBg = "#ffe6e6"; corTxt = "#dc3545"; corBorda = "#dc3545";
                    titulo = `🚨 ESCORE ${totalPews} (ALTO RISCO)`;
                    subtexto = `Acionar Enfermeiro/Médico imediato`;
                }

                statusTexto.innerHTML = `${titulo}<span class="subtexto-conduta">${subtexto}</span>`;
                statusTexto.style.backgroundColor = corBg;
                statusTexto.style.color = corTxt;
                statusTexto.style.border = `1px solid ${corBorda}`;
            }
        }

        async function enviarDadosParaPlanilha() {
            const prontuario = document.getElementById('input-prontuario').value.trim();
            const selectHora = document.getElementById('select-hora').value;
            const horaCustom = document.getElementById('input-hora-custom').value;
            const enfermeiro = document.getElementById('input-enfermeiro').value.trim();

            if (!prontuario) {
                alert("⚠️ Por favor, informe o número do prontuário.");
                document.getElementById('input-prontuario').focus();
                return;
            }

            let horaSelecionada = selectHora === 'outro' ? horaCustom : selectHora;
            if (!horaSelecionada) {
                alert("⚠️ Por favor, selecione ou informe o horário do registro.");
                return;
            }

            const hojeStr = new Date().toISOString().split('T')[0];

            const { data: plantaoAtual, error } = await _supabase
                .from('plantoes')
                .select('dados_json')
                .eq('data_chave', hojeStr)
                .maybeSingle();

            let listaPacientes = plantaoAtual && plantaoAtual.dados_json ? plantaoAtual.dados_json : [];

            let valoresVitaisForm = [];
            if (modoPediátricoAtivo) {
                valoresVitaisForm = [
                    "-",
                    document.getElementById('pews-temp').value,
                    document.getElementById('pews-fr').value,
                    document.getElementById('pews-fc').value,
                    "-",
                    "-",
                    document.getElementById('pews-comp').value,
                    document.getElementById('glicemia-pews').value,
                    document.getElementById('escala-dor').value,
                    document.getElementById('news-total').value,
                    ""
                ];
            } else {
                valoresVitaisForm = [
                    document.getElementById('pas').value,
                    document.getElementById('temp').value,
                    document.getElementById('fr').value,
                    document.getElementById('fc').value,
                    document.getElementById('o2').value,
                    document.getElementById('sat').value,
                    document.getElementById('consc').value,
                    document.getElementById('glicemia').value,
                    document.getElementById('escala-dor').value,
                    document.getElementById('news-total').value,
                    ""
                ];
            }

            let pacienteAlvo = listaPacientes.find(p => p.prontuario && p.prontuario.toString().trim() === prontuario);

            if (pacienteAlvo) {
                pacienteAlvo.tec = tecnicoLogadoGlobal;
                if (enfermeiro) pacienteAlvo.enfermeiro = enfermeiro;

                let linhaExistente = pacienteAlvo.vitais.find(v => v.hora === horaSelecionada);
                if (linhaExistente) {
                    linhaExistente.inputs = valoresVitaisForm;
                } else {
                    pacienteAlvo.vitais.push({
                        hora: horaSelecionada,
                        inputs: valoresVitaisForm,
                        isExtra: true
                    });
                }
            } else {
                const novoNome = document.getElementById('novo-nome-paciente')?.value.trim();
                const novaDtNasc = document.getElementById('novo-dtnasc-paciente')?.value || "";
                const novoSetor = document.getElementById('novo-setor-paciente')?.value || 'corredor';
                const novoLeito = document.getElementById('novo-leito-paciente')?.value || '01';

                if (!novoNome) {
                    alert("⚠️ Prontuário não encontrado. Preencha o Nome e o Setor para cadastrar o novo paciente.");
                    document.getElementById('novo-nome-paciente').focus();
                    return;
                }

                const novoPacienteObj = {
                    setor: novoSetor,
                    leito: novoLeito,
                    nome: novoNome,
                    dtNasc: novaDtNasc,
                    prontuario: prontuario,
                    tec: tecnicoLogadoGlobal,
                    enfermeiro: enfermeiro || "",
                    isento: false,
                    desfecho: "Internado",
                    vitais: [
                        {
                            hora: horaSelecionada,
                            inputs: valoresVitaisForm,
                            isExtra: false
                        }
                    ]
                };
                listaPacientes.push(novoPacienteObj);
            }

            const { error: erroSave } = await _supabase
                .from('plantoes')
                .upsert({
                    data_chave: hojeStr,
                    dados_json: listaPacientes,
                    mes_ano: hojeStr.substring(0, 7),
                    updated_at: new Date()
                }, { onConflict: 'data_chave' });

            if (erroSave) {
                alert("❌ Erro ao enviar dados para a planilha: " + erroSave.message);
            } else {
                alert("✅ Sinais vitais enviados com sucesso para a planilha do plantão!");
                limparFormularioTecnico();
            }
        }

        function gerarRelatorioTecnico() {
            const hora = document.getElementById('select-hora').value === 'outro' ? document.getElementById('input-hora-custom').value : document.getElementById('select-hora').value;
            const enfermeiro = document.getElementById('input-enfermeiro').value.trim() || "[Nome do Enfermeiro]";
            
            const selectDor = document.getElementById('escala-dor');
            const dor = selectDor && selectDor.selectedOptions[0] ? selectDor.selectedOptions[0].text : "Não avaliado";
            const escoreVal = parseInt(document.getElementById('news-total').value) || 0;

            let texto = "";
            if (modoPediátricoAtivo) {
                const fc = document.getElementById('pews-fc').value || "-";
                const fr = document.getElementById('pews-fr').value || "-";
                const temp = document.getElementById('pews-temp').value || "-";
                texto = `Em tempo, às ${hora} horas, comunico sinais vitais pediátricos: Temp ${temp}°C, FC ${fc}bpm, FR ${fr}irpm, Dor: ${dor}. Valor de PEWS: ${escoreVal}. Comunicado à enfermeira ${enfermeiro}.`;
            } else {
                const pas = document.getElementById('pas').value || "-";
                const temp = document.getElementById('temp').value || "-";
                const fr = document.getElementById('fr').value || "-";
                const fc = document.getElementById('fc').value || "-";
                const sat = document.getElementById('sat').value || "-";
                texto = `Em tempo, às ${hora} horas, comunico valores de sinais vitais: PA ${pas}mmHg, Temp ${temp}°C, FC ${fc}bpm, FR ${fr}irpm, SatO₂ ${sat}%, Dor: ${dor}. Valor de NEWS: ${escoreVal}. Comunicado à enfermeira ${enfermeiro}.`;
            }

            const modal = document.getElementById('modal-relatorio');
            const textarea = document.getElementById('texto-relatorio-gerado');
            if (textarea) textarea.value = texto;
            if (modal) modal.style.display = 'flex';
        }

        function copiarTextoRelatorio() {
            const textarea = document.getElementById('texto-relatorio-gerado');
            const btnCopiar = document.getElementById('btn-copiar-texto');

            if (textarea) {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    if (btnCopiar) {
                        const textoOriginal = btnCopiar.textContent;
                        btnCopiar.textContent = "✅ Copiado com sucesso!";
                        btnCopiar.style.backgroundColor = "#15803d";

                        setTimeout(() => {
                            btnCopiar.textContent = textoOriginal;
                            btnCopiar.style.backgroundColor = "#28a745";
                        }, 2000);
                    }
                }).catch(err => {
                    console.error("Erro ao copiar: ", err);
                });
            }
        }

        function fecharModalRelatorio() {
            const modal = document.getElementById('modal-relatorio');
            if (modal) modal.style.display = 'none';
        }

        function limparFormularioTecnico() {
            document.getElementById('input-prontuario').value = "";
            document.getElementById('input-enfermeiro').value = "";
            
            ['pas', 'temp', 'fr', 'fc', 'sat', 'glicemia', 'pews-fc', 'pews-fr', 'pews-temp', 'glicemia-pews'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = "";
            });
            ['o2', 'consc', 'escala-dor', 'pews-comp', 'pews-vomitos', 'pews-nebulizador'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.selectedIndex = 0;
            });

            document.getElementById('news-total').value = "";
            document.getElementById('status-news-texto').textContent = "Aguardando...";
            document.getElementById('status-news-texto').style.backgroundColor = "transparent";
            document.getElementById('status-news-texto').style.color = "#333";
            document.getElementById('status-news-texto').style.border = "1px solid transparent";
            
            const infoBox = document.getElementById('paciente-info');
            const novoBox = document.getElementById('novo-paciente-container');
            if (infoBox) infoBox.style.display = 'none';
            if (novoBox) novoBox.style.display = 'none';

            document.getElementById('input-prontuario').focus();
        }
    </script>
