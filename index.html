<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Sepse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Sistema de Controle</h2>
            <p>Sinais Vitais e Sepse</p>
            
            <form id="form-login" onsubmit="realizarLogin(event)">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Digite sua identificação ou nome">
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha de acesso">
                </div>
                
                <button type="submit" class="btn-login">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <script>
        function realizarLogin(event) {
            event.preventDefault();
            
            const usuarioDigitado = document.getElementById('usuario').value.trim();
            const senhaDigitada = document.getElementById('senha').value.trim();
            
            // 1. Credenciais do Enfermeiro (Painel Completo)
            const USUARIO_ENF = "admin";
            const SENHA_ENF = "missao2026";

            // 2. Senha padrão unificada para todos os Técnicos
            const SENHA_PADRAO_TECNICOS = "enfermagem";

            if (usuarioDigitado === USUARIO_ENF && senhaDigitada === SENHA_ENF) {
                // Acesso do Enfermeiro
                window.location.href = "dashboard.html";
            } 
            else if (senhaDigitada === SENHA_PADRAO_TECNICOS) {
                // Acesso do Técnico: Salvamos o nome digitado no navegador para o formulário reconhecer
                localStorage.setItem('tecnico_logado_nome', usuarioDigitado);
                window.location.href = "dashboard_tecnico.html";
            } 
            else {
                alert("❌ Usuário ou senha incorretos! Tente novamente.");
                document.getElementById('senha').value = "";
                document.getElementById('senha').focus();
            }
        }
    </script>
</body>
</html>
