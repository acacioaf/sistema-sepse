<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Sepse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Sistema de Controle</h2>
            <p>Sinais Vitais e Sepse</p>
            
            <form id="form-login" onsubmit="realizarLogin(event)">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Digite sua identificação">
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha de acesso">
                </div>
                
                <button type="submit" class="btn-login">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <script>
        function realizarLogin(event) {
            event.preventDefault(); // Evita que a página recarregue
            
            const usuarioDigitado = document.getElementById('usuario').value.trim();
            const senhaDigitada = document.getElementById('senha').value.trim();
            
            // Credenciais de acesso configuradas
            const USUARIO_CORRETO = "admin";
            const SENHA_CORRETA = "missao2026";

            if (usuarioDigitado === USUARIO_CORRETO && senhaDigitada === SENHA_CORRETA) {
                window.location.href = "dashboard.html"; // Redireciona para o painel principal se estiver correto
            } else {
                alert("❌ Usuário ou senha incorretos! Tente novamente.");
                document.getElementById('senha').value = ""; // Limpa o campo de senha
                document.getElementById('senha').focus();
            }
        }
    </script>
</body>
</html>
