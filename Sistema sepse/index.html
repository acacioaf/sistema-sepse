<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Sepse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Sistema de Controle</h2>
            <p>Sinais Vitais e Sepse</p>
            
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Digite sua identificação">
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha de acesso">
                </div>
                
                <button type="submit" class="btn-login">Entrar no Sistema</button>
            </form>
        </div>
    </div>
</body>
</html>
